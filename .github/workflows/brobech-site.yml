# Fetches the pages and media of Murerfirmaet Brøbech's site for the demo at /demo/brobechv2
# (see scripts/brobech-site.mjs) and commits them. Runs by hand, or on a push that touches the workflow or the script.
name: Brøbech site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/brobech-site.yml", "scripts/brobech-site.mjs"]
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: node scripts/brobech-site.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add public/demo/brobech scripts/brobech-source
          git diff --cached --quiet || (git commit -m "Store Brøbech's pages and media for the demo" && git push)
